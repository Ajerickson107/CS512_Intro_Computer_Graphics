<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>UNM CS 412/512 HW4 - Hierarchical Modeling</title>
  <style>
    body {
      background: #111;
      color: #ccc;
      font-family: monospace;
    }

    textarea {
      background: #222;
      color: #0f0;
      font: 14px monospace;
      width: 400px;
      height: 250px;
    }

    canvas {
      border: 1px solid #444;
    }
    
    .control-group {
      display: inline-block;
      margin-right: 20px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <h2>HW4: Hierarchical Modeling (Robotic Arm)</h2>
  <p>Edit vertex and fragment shaders on the left to get the result instantly.<br>
  Use mouse to drag and rotate the world view. <br>
  Use arrow keys and w, s keys to move the camera.</p>

<div style="background: #222; padding: 10px; margin-bottom: 10px; border: 1px solid #444;">
    <b>Hierarchical Controls</b><br><br>
    
    <!-- UI Elements for chained movements -->
    <div class="control-group">
      <label for="baseSlider">Base Rotation (Y):</label><br>
      <input type="range" id="baseSlider" min="-180" max="180" step="1" value="0">
    </div>
    
    <div class="control-group">
      <label for="shoulderSlider">Shoulder Joint (X):</label><br>
      <input type="range" id="shoulderSlider" min="-90" max="90" step="1" value="45">
    </div>
    
    <div class="control-group">
      <label for="elbowSlider">Elbow Joint (X):</label><br>
      <input type="range" id="elbowSlider" min="-120" max="120" step="1" value="-60">
    </div>

    <div class="control-group">
      <label for="wristSlider">Wrist/Hand Spin (Y):</label><br>
      <input type="range" id="wristSlider" min="-180" max="180" step="1" value="0">
    </div>

    <div class="control-group" style="border-left: 1px solid #444; padding-left: 20px;">
      <label for="animateCheck" style="color: #ffaa00;"><b>Bonus: Auto-Animate!</b></label><br>
      <input type="checkbox" id="animateCheck">
    </div>
  </div>

  <div style="display: flex; gap: 10px; align-items: flex-start;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div>
        <b>Vertex Shader</b><br>
        <textarea id="vertEditor"></textarea>
      </div>
      <div>
        <b>Fragment Shader</b><br>
        <textarea id="fragEditor"></textarea>
      </div>
    </div>
    <div>
      <canvas id="glcanvas" width="400" height="400"></canvas>
    </div>
  </div>

  <!-- Vertex shader -->
  <script id="vertex-shader" type="x-shader/x-vertex">#version 300 es
in vec3 aPosition;
in vec3 aColor;

uniform float uTime;
uniform mat4 uModelViewMatrix;
uniform mat4 uProjectionMatrix;
uniform mat4 uModelTransformationMatrix;

out vec3 vColor;

void main() {
  gl_Position = uProjectionMatrix * uModelViewMatrix * uModelTransformationMatrix * vec4(aPosition,1.0);
  vColor = aColor;
}
</script>
  <!-- Fragment Shader -->
  <script id="fragment-shader" type="x-shader/x-fragment">#version 300 es
precision mediump float;
in vec3 vColor;

out vec4 fragColor;

void main() {
  fragColor = vec4(vColor,1.0);
}
</script>

  <script src="primitives.js"></script>
  <script src="transformations.js"></script>

  <script>
    function createShader(gl, type, source) {
      let shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    function createProgram(gl, vsSource, fsSource) {
      let vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
      let fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
      let prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(prog));
      }
      return prog;
    }

    const canvas = document.getElementById("glcanvas");
    const gl = canvas.getContext("webgl2");
    if (!gl) alert("WebGL2 not supported");

    let vertEditor = document.getElementById("vertEditor");
    let fragEditor = document.getElementById("fragEditor");
    vertEditor.value = document.getElementById("vertex-shader").textContent;
    fragEditor.value = document.getElementById("fragment-shader").textContent;

    let program, posLoc, colorLoc, timeLoc, uMVM, uPM, uMTM;
    let vbo, nbo, ibo;

    let currentPositions = positions;
    let currentColors = colors;
    let currentIndices = indices;

    function initBuffers() {
      if (!vbo) vbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.bufferData(gl.ARRAY_BUFFER, currentPositions, gl.STATIC_DRAW);

      if (!nbo) nbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, nbo);
      gl.bufferData(gl.ARRAY_BUFFER, currentColors, gl.STATIC_DRAW);

      if (!ibo) ibo = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo); 
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, currentIndices, gl.STATIC_DRAW);
    }
    initBuffers();

    function initShaderProgram() {
      try {
        program = createProgram(gl, vertEditor.value, fragEditor.value);
        gl.useProgram(program);
        posLoc = gl.getAttribLocation(program, "aPosition");
        colorLoc = gl.getAttribLocation(program, "aColor");
        timeLoc = gl.getUniformLocation(program, "uTime");
        uMVM = gl.getUniformLocation(program, "uModelViewMatrix");
        uPM = gl.getUniformLocation(program, "uProjectionMatrix");
        uMTM = gl.getUniformLocation(program, "uModelTransformationMatrix");
      } catch (e) { console.error(e); }
    }
    initShaderProgram();
    vertEditor.onkeyup = initShaderProgram;
    fragEditor.onkeyup = initShaderProgram;

    // Mouse and keyboard interactions
    let mouseDown = false, lastX, lastY, worldRotX = 0, worldRotY = 0;
    let camX = 0, camY = 0, camZ = -8; // Pulled camera back slightly to fit arm

    canvas.addEventListener('mousedown', e => { mouseDown = true; lastX = e.clientX; lastY = e.clientY; });
    canvas.addEventListener('mouseup', () => mouseDown = false);
    canvas.addEventListener('mousemove', e => {
      if (!mouseDown) return;
      let dx = e.clientX - lastX;
      let dy = e.clientY - lastY;
      worldRotY += dx * 0.01;
      worldRotX += dy * 0.01;
      lastX = e.clientX; lastY = e.clientY;
    });

    document.addEventListener('keydown', e => {
      const step = 0.2;
      switch (e.key) {
        case 'ArrowUp': camY -= step; break;
        case 'ArrowDown': camY += step; break;
        case 'ArrowLeft': camX += step; break;
        case 'ArrowRight': camX -= step; break;
        case 'w': camZ += step; break;
        case 's': camZ -= step; break;
      }
    });

    let fov = Math.PI / 4, aspect = canvas.width / canvas.height, zNear = 0.1, zFar = 100;
    let orthoSize = 4.0;
    let projOrtho = matMul(
      box2Cube(-orthoSize * aspect, orthoSize * aspect, -orthoSize, orthoSize, zNear, zFar),
      flipZ()
    );
    let proj = projOrtho;

    let startTime = Date.now();

    // Helper to draw a single node of the hierarchy
    function drawNode(transformationMatrix) {
      gl.uniformMatrix4fv(uMTM, false, transformationMatrix);
      gl.drawElements(gl.TRIANGLES, currentIndices.length, gl.UNSIGNED_SHORT, 0);
    }

    function render() {
      gl.enable(gl.DEPTH_TEST);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      let deltaTime = Date.now() - startTime;
      gl.uniform1f(timeLoc, deltaTime/1000.0);
      gl.uniformMatrix4fv(uPM, false, proj);

      // Camera view matrix
      let modelViewMatrix = mat4Translate(mat4Identity(), [camX, camY, camZ]);
      gl.uniformMatrix4fv(uMVM, false, modelViewMatrix);

      // World Rotation (from Mouse)
      let cx = Math.cos(worldRotY), sx = Math.sin(worldRotY);
      let cy = Math.cos(worldRotX), sy = Math.sin(worldRotX);
      let rotX = [1, 0, 0, 0, 0, cy, sy, 0, 0, -sy, cy, 0, 0, 0, 0, 1];
      let rotY = [cx, 0, -sx, 0, 0, 1, 0, 0, sx, 0, cx, 0, 0, 0, 0, 1];
      let worldRotation = multiplyMat4(rotY, rotX);
      
      // Shift entire structure down slightly to center the view
      let mWorld = matMul(worldRotation, mat4Translate(mat4Identity(), [0, -1.5, 0]));

      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.enableVertexAttribArray(posLoc);
      gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ARRAY_BUFFER, nbo);
      gl.enableVertexAttribArray(colorLoc);
      gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 0, 0);
      
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);

      // Retrieve UI variables
      let baseAngle = parseFloat(document.getElementById("baseSlider").value) * Math.PI / 180;
      let shoulderAngle = parseFloat(document.getElementById("shoulderSlider").value) * Math.PI / 180;
      let elbowAngle = parseFloat(document.getElementById("elbowSlider").value) * Math.PI / 180;
      let wristAngle = parseFloat(document.getElementById("wristSlider").value) * Math.PI / 180;
      let doAnimate = document.getElementById("animateCheck").checked;

      // Bonus: Outstanding Effect (+1 pt) - Automated Chained Movements over time
      if (doAnimate) {
        baseAngle += Math.sin(deltaTime / 800.0) * 0.5;
        shoulderAngle += Math.sin(deltaTime / 500.0) * 0.5;
        elbowAngle += Math.cos(deltaTime / 500.0) * 0.8;
      }

      /* === HIERARCHICAL STRUCTURE (4 Levels) === */
      
      // LEVEL 1: BASE
      let mBase = matMul(mWorld, mat4RotateY(mat4Identity(), baseAngle));
      let drawBaseMatrix = matMul(mBase, mat4Scale(mat4Identity(), [1.0, 0.2, 1.0])); // Scale to flat base
      drawNode(drawBaseMatrix);

      // LEVEL 2: LOWER ARM
      // Translate up to sit on top of the base (Y offset 0.2)
      let mLowerArm = matMul(mBase, 
                             mat4Translate(mat4Identity(), [0, 0.2, 0]), 
                             mat4RotateX(mat4Identity(), shoulderAngle));
                             
      // Translate Y by +1.0 during draw so the pivot point remains at the bottom of the cube
      let drawLowerArmMatrix = matMul(mLowerArm, 
                                      mat4Translate(mat4Identity(), [0, 1.0, 0]), 
                                      mat4Scale(mat4Identity(), [0.3, 1.0, 0.3]));
      drawNode(drawLowerArmMatrix);

      // LEVEL 3: UPPER ARM
      // Translate up to the top of the lower arm (Y offset 2.0 because Lower Arm Y scale is 1.0)
      let mUpperArm = matMul(mLowerArm, 
                             mat4Translate(mat4Identity(), [0, 2.0, 0]), 
                             mat4RotateX(mat4Identity(), elbowAngle));
                             
      let drawUpperArmMatrix = matMul(mUpperArm, 
                                      mat4Translate(mat4Identity(), [0, 0.8, 0]), 
                                      mat4Scale(mat4Identity(), [0.25, 0.8, 0.25]));
      drawNode(drawUpperArmMatrix);

      // LEVEL 4: HAND / END EFFECTOR
      // Translate up to the top of the upper arm (Y offset 1.6 because Upper Arm Y scale is 0.8)
      let mHand = matMul(mUpperArm, 
                         mat4Translate(mat4Identity(), [0, 1.6, 0]), 
                         mat4RotateY(mat4Identity(), wristAngle)); // Wrist rotates around local Y axis
                         
      let drawHandMatrix = matMul(mHand, 
                                  mat4Translate(mat4Identity(), [0, 0.2, 0]), 
                                  mat4Scale(mat4Identity(), [0.4, 0.2, 0.4]));
      drawNode(drawHandMatrix);
    }

    window.onload = function () {
      setInterval(render, 30);
    }
  </script>
</body>
</html>
